<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>pagebot · Account notice</title>
<style>
/* The ban notice, on the pagebot site itself: the homepage's calm white page, with the notice as one card. */
:root{--bg:#fff;--ink:#22302c;--soft:#56645f;--muted:#8a9590;--line:#e6eae4;--pill:#eef1eb;--card:#f5f7f2;
  --teal:#0f5f57;--teal-d:#0a443e;--red:#b4432f;--red-bg:#fbeeea;--dark:#2a2523;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font:16px/1.6 var(--sans);color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
a{color:inherit}
[hidden]{display:none!important}
.wrap{width:100%;max-width:1240px;margin:0 auto;padding:0 clamp(16px,4vw,56px)}
nav{display:flex;align-items:center;justify-content:space-between;height:92px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:400 27px/1 var(--serif);letter-spacing:-.01em}
.brand svg{width:26px;height:26px}
.go{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:999px;background:var(--pill);text-decoration:none;font-weight:500;transition:background .15s}
.go:hover{background:#e3e8df}
main{flex:1;display:flex;justify-content:center;padding-top:clamp(16px,6vh,64px);padding-bottom:64px}
.notice{width:100%;max-width:620px;border-radius:26px;background:var(--card);padding:clamp(24px,5vw,44px);border-top:6px solid var(--red)}
.notice.term{border-top-color:var(--dark)}
.notice.ok{border-top-color:var(--teal)}
.badge{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:var(--red-bg);color:var(--red)}
.notice.term .badge{background:var(--dark);color:#fff}
.notice.ok .badge{background:#e2efec;color:var(--teal)}
.badge svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.kicker{margin:22px 0 0;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--red)}
.notice.term .kicker{color:var(--dark)}
.notice.ok .kicker{color:var(--teal)}
h1{margin:6px 0 0;font:400 clamp(36px,6vw,54px)/1.04 var(--serif);letter-spacing:-.03em;overflow-wrap:anywhere}
.lede{margin:14px 0 0;font-size:18px;color:var(--soft)}
.facts{margin:26px 0 0;padding:0;border-top:1px solid var(--line)}
.facts>div{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.facts dt{color:var(--muted);font-size:14.5px}
.facts dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.facts dd b{font-weight:600}
.clock{margin:22px 0 0;padding:16px 18px;border-radius:16px;background:#fff}
.clock .t{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.clock b{font:400 28px/1.1 var(--serif);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.clock span{color:var(--muted);font-size:14px}
.track{margin-top:10px;height:8px;border-radius:99px;background:var(--pill);overflow:hidden}
.track i{display:block;height:100%;width:0;border-radius:99px;background:var(--red);transition:width .4s ease}
.notice.term .track i{background:var(--dark)}
.body{margin:22px 0 0;font-size:16.5px;color:var(--ink)}
form{margin:22px 0 0;padding:18px;border-radius:16px;background:#fff}
.agree{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:15.5px}
.agree input{width:18px;height:18px;margin:3px 0 0;accent-color:var(--teal);flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;padding:13px 28px;border:0;border-radius:999px;background:var(--teal);color:#fff;font:500 16px var(--sans);text-decoration:none;cursor:pointer;transition:background .15s,opacity .15s}
.btn:hover{background:var(--teal-d)}
.btn:disabled{opacity:.45;cursor:default;background:var(--teal)}
.err{margin:10px 0 0;color:var(--red);font-size:14px;min-height:1px}
.fine{margin:26px 0 0;font-size:13.5px;color:var(--muted)}
footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:30px 0 40px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
footer a{color:var(--muted)}
@media (max-width:560px){
  nav{height:76px}
  .brand{font-size:24px}
  .go{padding:10px 16px;font-size:15px}
  .facts>div{grid-template-columns:1fr;gap:2px}
}
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <a class="brand" href="/"><svg viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="12" fill="none" stroke="#0f5f57" stroke-width="2"/><path d="M7 15.5c2-1.6 4-1.6 6 0s4 1.6 6 0M7 11c2-1.6 4-1.6 6 0s4 1.6 6 0" fill="none" stroke="#2c8f8a" stroke-width="1.8" stroke-linecap="round"/></svg>pagebot</a>
    <a class="go" href="/">pagebot home →</a>
  </nav>
</div>
<main class="wrap">
  <article class="notice" id="notice" aria-live="polite">
    <div class="badge"><svg id="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5h.01"/></svg></div>
    <p class="kicker" id="kicker">Account notice</p>
    <h1 id="title">Loading your notice…</h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts" hidden>
      <div><dt>Account</dt><dd id="fName"></dd></div>
      <div><dt>Reviewed</dt><dd id="fAt"></dd></div>
      <div><dt>Reason</dt><dd><b id="fReason"></b></dd></div>
      <div id="noteRow"><dt>Moderator note</dt><dd id="fNote"></dd></div>
      <div id="endRow"><dt id="endL">Ends</dt><dd id="fEnd"></dd></div>
    </dl>
    <div class="clock" id="clock" hidden>
      <div class="t"><b id="left"></b><span id="leftL"></span></div>
      <div class="track"><i id="bar"></i></div>
    </div>
    <p class="body" id="body" hidden></p>
    <form id="react" hidden>
      <label class="agree"><input type="checkbox" id="agree"> <span>I agree to follow pagebot’s rules. I understand that breaking them again can get my account banned for longer or terminated.</span></label>
      <button class="btn" id="reactBtn" type="submit" disabled>Re-activate my account</button>
      <p class="err" id="err" role="alert"></p>
    </form>
    <a class="btn" id="home" href="/" hidden>Go to pagebot</a>
    <p class="fine" id="fine" hidden>Notice <span id="fId"></span> · If you think this is a mistake, contact the person who runs this pagebot.</p>
  </article>
</main>
<div class="wrap"><footer><span>pagebot · account notice</span><span><a href="/">Home</a> · <a href="/chat">Web chat</a></span></footer></div>

<script>
(() => {
const $ = s => document.querySelector(s);
// the key comes after the #, so it never reaches the server's logs or another site
const key = decodeURIComponent(location.hash.slice(1));
const when = new Intl.DateTimeFormat(undefined, { dateStyle: 'medium', timeStyle: 'short' });
const day = new Intl.DateTimeFormat(undefined, { dateStyle: 'long' });
const dur = h => h == null ? 'permanently' : h < 24 ? `${h} hour${h === 1 ? '' : 's'}` : `${h / 24} day${h === 24 ? '' : 's'}`;
const ICONS = {
  ban: '<circle cx="12" cy="12" r="9"/><path d="m5.6 5.6 12.8 12.8"/>',
  term: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  ok: '<path d="M20 6 9 17l-5-5"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  missing: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9.2a2.6 2.6 0 0 1 5 1c0 1.7-2.5 2.3-2.5 3.8M12 17h.01"/>',
};
let ban = null, tick = 0, skew = 0; // skew: how far the server's clock is ahead of this one
const now = () => Date.now() + skew;

function show({ tone = 'ban', icon = 'ban', kicker, title, lede = '', body = '', facts = false, home = false }) {
  $('#notice').className = 'notice' + (tone === 'term' ? ' term' : tone === 'ok' ? ' ok' : '');
  $('#icon').innerHTML = ICONS[icon];
  $('#kicker').textContent = kicker;
  $('#title').textContent = title;
  document.title = `pagebot · ${title}`;
  $('#lede').textContent = lede; $('#lede').hidden = !lede;
  $('#body').textContent = body; $('#body').hidden = !body;
  $('#facts').hidden = $('#fine').hidden = !facts;
  $('#home').hidden = !home;
  $('#react').hidden = $('#clock').hidden = true;
}
function fill(b) {
  $('#fName').textContent = b.name;
  $('#fAt').textContent = when.format(new Date(b.at));
  $('#fReason').textContent = b.reason;
  $('#fNote').textContent = b.note; $('#noteRow').hidden = !b.note;
  $('#fId').textContent = '#' + b.id;
  $('#endRow').hidden = !b.endsAt;
  if (b.endsAt) {
    $('#endL').textContent = b.kind === 'terminate' ? 'Deleted on' : 'Ends';
    $('#fEnd').textContent = when.format(new Date(b.endsAt));
  }
}
function left(ms) {
  const s = Math.max(0, Math.ceil(ms / 1000)), d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return d ? `${d}d ${h}h ${m}m` : h ? `${h}h ${m}m ${s % 60}s` : `${m}m ${s % 60}s`;
}
// a countdown to the end of a ban or to the deletion of a terminated account
function clock() {
  clearInterval(tick);
  const end = new Date(ban.endsAt).getTime(), start = new Date(ban.at).getTime();
  const draw = () => {
    const ms = end - now();
    $('#left').textContent = left(ms);
    $('#bar').style.width = Math.min(100, Math.max(0, (now() - start) / (end - start) * 100)) + '%';
    if (ms <= 0) { clearInterval(tick); setTimeout(load, 1500); } // the ban just ended (or the account is due): show what's next
  };
  $('#leftL').textContent = ban.kind === 'terminate' ? 'until the account is deleted' : 'until you can re-activate';
  $('#clock').hidden = false;
  draw(); tick = setInterval(draw, 1000);
}

function render() {
  const b = ban, title = `Banned ${b.hours == null ? 'permanently' : 'for ' + dur(b.hours)}`;
  fill(b);
  clearInterval(tick);
  const past = b.endsAt && new Date(b.endsAt) <= now();
  if (b.state === 'terminated' && !past) {
    show({ tone: 'term', icon: 'term', kicker: 'Account terminated', title: 'Account terminated', facts: true,
      lede: 'Our review found that your use of pagebot seriously broke its rules.',
      body: `Your account, ${b.name}, has been terminated and can’t be used again. Every time you sign in you’ll see this notice. ` +
        `On ${day.format(new Date(b.endsAt))} the account and everything saved in it are deleted for good.` });
    clock();
  } else if (b.state === 'terminated' || b.state === 'deleted') {
    show({ tone: 'term', icon: 'term', kicker: 'Account deleted', title: 'Account deleted', facts: b.kind === 'terminate',
      body: b.kind === 'terminate' ? `This account was terminated and then deleted${b.endsAt ? ' on ' + day.format(new Date(b.endsAt)) : ''}. It can’t be signed into anymore.`
        : 'This account has been deleted. It can’t be signed into anymore.' });
  } else if (b.state === 'active') {
    show({ kicker: 'Account banned', title, facts: true,
      lede: 'Our review found that your use of pagebot broke its rules.',
      body: b.endsAt ? `Your account is disabled for ${dur(b.hours)}. You can re-activate it after ${when.format(new Date(b.endsAt))}. Until then, signing in shows this notice.`
        : 'Your account is disabled for good. Signing in shows this notice.' });
    if (b.endsAt) clock();
  } else if (b.state === 'ended') {
    show({ icon: 'clock', kicker: 'Your ban is over', title, facts: true,
      body: 'Your ban has run its course. Agree to follow the rules to re-activate your account, then open pagebot again.' });
    $('#react').hidden = false;
  } else if (b.state === 'reactivated') {
    show({ tone: 'ok', icon: 'ok', kicker: 'Account re-activated', title: 'Welcome back', home: true,
      body: `Your account, ${b.name}, is active again. Open the pagebot panel and pick up where you left off.` });
  } else {
    show({ tone: 'ok', icon: 'ok', kicker: 'Ban lifted', title: 'You’re all set', home: true,
      body: `The ban on ${b.name} was lifted. You can use pagebot again.` });
  }
}

async function post(path, data) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || 'Something went wrong. Try again.'), { status: r.status, data: j });
  return j;
}
function missing(text) {
  show({ tone: 'term', icon: 'missing', kicker: 'Account notice', title: 'Notice not found', home: true, body: text });
}
async function load() {
  if (!key) return missing('This link doesn’t point to a notice. Open pagebot and sign in to see yours.');
  try {
    const t0 = Date.now(), r = await post('/api/ban-notice', { key });
    skew = new Date(r.now).getTime() - (t0 + Date.now()) / 2 || 0;
    ban = r.ban; render();
  }
  catch (e) { missing(e.status === 404 ? 'We couldn’t find that notice. It may have been removed.' : 'We couldn’t load your notice. Check your connection and refresh this page.'); }
}

$('#agree').addEventListener('change', () => { $('#reactBtn').disabled = !$('#agree').checked; });
$('#react').addEventListener('submit', async e => {
  e.preventDefault();
  $('#err').textContent = ''; $('#reactBtn').disabled = true; $('#reactBtn').textContent = 'Re-activating…';
  try { ban = (await post('/api/ban-notice/reactivate', { key, agree: true })).ban; render(); }
  catch (err) {
    $('#err').textContent = err.message;
    if (err.data?.ban) { ban = err.data.ban; if (ban.state !== 'ended') render(); }
  } finally { $('#reactBtn').textContent = 'Re-activate my account'; $('#reactBtn').disabled = !$('#agree').checked; }
});
addEventListener('hashchange', () => location.reload());
load();
})();
</script>
</body>
</html>
