<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<title>pagebot</title>
<style>
:root{--bg:#fff;--ink:#22302c;--muted:#8a9590;--teal:#0f5f57;--teal-d:#0a443e;--glow:rgba(15,95,87,.22);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#101413;--ink:#e4eae7;--muted:#7c8783;--teal:#17776d;--teal-d:#1c887d;--glow:rgba(0,0,0,.4)}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink)}
main{display:flex;flex-direction:column;align-items:center;text-align:center}
.btn{display:inline-flex;align-items:center;gap:10px;padding:15px 34px;border-radius:999px;background:var(--teal);color:#fff;font-size:19px;font-weight:500;text-decoration:none;cursor:grab;
  box-shadow:0 8px 24px var(--glow);transition:transform .12s,background .15s;-webkit-user-select:none;user-select:none}
.btn:hover{background:var(--teal-d);transform:translateY(-1px)}
.btn:active{cursor:grabbing;transform:translateY(1px)}
.hint{max-width:26em;margin:18px 0 0;font-size:14px;color:var(--muted)}
.hint.up{color:var(--ink);font-weight:600}
.copy{margin-top:4px;padding:6px 8px;border:0;background:none;font:inherit;font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.copy:hover{color:var(--ink)}
.btn:focus-visible,.copy:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>
<main>
  <a class="btn" id="bm" href="{{HREF}}" title="Drag me to your bookmarks bar" data-v="{{VERSION}}">📌 pagebot</a>
  <p class="hint" id="hint" role="status">Drag to your bookmarks bar.</p>
  <button class="copy" id="copy" type="button">Can’t drag? Copy it instead</button>
</main>
<script>
(() => {
const $ = s => document.querySelector(s), bm = $('#bm'), hint = $('#hint');
// clicking the button here would just run it on this page; it's meant to be dragged to the bookmarks bar
bm.addEventListener('click', e => {
  e.preventDefault();
  hint.textContent = 'Drag it onto your bookmarks bar (Ctrl/Cmd+Shift+B shows it).';
});
// ?update: the bookmark in use is from an older version
if (new URLSearchParams(location.search).has('update')) {
  hint.textContent = `Drag this to your bookmarks bar again to get v${bm.dataset.v}. Then you can delete the old bookmark.`;
  hint.classList.add('up');
}
// for browsers with no bookmarks bar to drag to: the same link, to paste into a new bookmark's address
$('#copy').addEventListener('click', async e => {
  const code = bm.getAttribute('href');
  let ok = false;
  try { await navigator.clipboard.writeText(code); ok = true; } catch {
    const t = document.createElement('textarea');
    t.value = code; t.style.cssText = 'position:fixed;opacity:0'; document.body.append(t); t.select();
    try { ok = document.execCommand('copy'); } catch { /* nothing else to try */ }
    t.remove();
  }
  e.target.textContent = ok ? 'Copied. Make a new bookmark and paste it as the address.' : 'Couldn’t copy. Drag the button instead.';
});
})();
</script>
</body>
</html>
