<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<title>pagebot</title>
<style>
:root{--bg:#fbf5ec;--ink:#3a2a20;--muted:#735a4a;--tint:#f2e6d6;--btn:#b8441e;--btn-h:#a93d1a;--on-btn:#fff;--glow:rgba(150,70,30,.22);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#1f1915;--ink:#f6ece2;--muted:#c8b4a4;--tint:#2e251f;--btn:#f4a882;--btn-h:#f8bb9c;--on-btn:#2c160b;--glow:rgba(0,0,0,.45)}}
*{box-sizing:border-box}
/* the column hangs from a fixed point a little above the middle, so a longer hint grows downward and the button never moves under the pointer */
body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:start center;padding:24px 16px;padding-top:max(24px,calc(50vh - 100px));padding-top:max(24px,calc(50svh - 100px));background:var(--bg);color:var(--ink)}
main{display:flex;flex-direction:column;align-items:center;text-align:center}
.btn{display:inline-flex;align-items:center;gap:10px;padding:16px 34px 16px 26px;border-radius:999px;background:var(--btn);color:var(--on-btn);
  font:700 20px/1.2 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-decoration:none;cursor:grab;
  box-shadow:0 6px 18px var(--glow);transition:transform .15s,background-color .15s;-webkit-user-select:none;user-select:none}
/* a little grip, so it looks like something to pick up; drawn in CSS so the bookmark's name stays just "pagebot" */
.btn::before{content:"";width:4px;height:4px;margin-right:6px;border-radius:50%;background:currentColor;opacity:.75;box-shadow:0 -6px,0 6px,6px -6px,6px 0,6px 6px}
.btn:hover{background:var(--btn-h);transform:translateY(-2px)}
.btn:active{cursor:grabbing;transform:translateY(1px)}
.hint{max-width:24em;margin:20px 0 0;font-size:15px;color:var(--muted)}
.hint.up{color:var(--ink);font-weight:600}
.copy{min-height:44px;margin-top:6px;padding:8px 16px;border:0;border-radius:999px;background:none;font:inherit;font-size:14px;color:var(--muted);
  text-decoration:underline;text-underline-offset:3px;cursor:pointer;transition:background-color .15s}
.copy:hover{color:var(--ink);background:var(--tint)}
.touch .copy{margin-top:12px;padding:8px 20px;border:2px solid var(--btn);background:var(--tint);color:var(--ink);font-weight:600;text-decoration:none}
.btn:focus-visible,.copy:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.btn,.copy{transition:none}.btn:hover,.btn:active{transform:none}}
</style>
</head>
<body>
<main>
  <a class="btn" id="bm" href="{{HREF}}" title="Drag me up to your bookmarks bar" data-v="{{VERSION}}">pagebot</a>
  <p class="hint" id="hint" role="status">Drag this up to your bookmarks bar.</p>
  <button class="copy" id="copy" type="button">Can’t drag? Copy it instead</button>
</main>
<script>
(() => {
const $ = s => document.querySelector(s), bm = $('#bm'), hint = $('#hint'), v = bm.dataset.v;
// a phone or tablet has no bookmarks bar to drag to, so there the copy button is the way in
const touch = matchMedia('(hover:none) and (pointer:coarse)').matches;
const onTouch = 'On a phone or tablet? Copy it, then save it as a bookmark’s address.';
if (touch) { document.documentElement.classList.add('touch'); hint.textContent = onTouch; }
// clicking the button here would just run it on this page; it's meant to be dragged to the bookmarks bar
// (on a phone or tablet the hint already says what to do, ?update's steps included, so a tap only points at it)
bm.addEventListener('click', e => {
  e.preventDefault();
  if (!touch) hint.textContent = 'Don’t click it, drag it: pull the button up to your bookmarks bar. Can’t see the bar? Press Ctrl+Shift+B (⌘+Shift+B on a Mac).';
  hint.classList.add('up');
});
// ?update: the bookmark in use is from an older version
if (new URLSearchParams(location.search).has('update')) {
  hint.textContent = touch ? `Time for the new one (v${v}). Copy it, save it as a bookmark’s address, then delete the old one.`
    : `Time for the new one (v${v}). Drag this up to your bookmarks bar, then delete the old bookmark.`;
  hint.classList.add('up');
}
// for browsers with no bookmarks bar to drag to: the same link, to paste into a bookmark's address
$('#copy').addEventListener('click', async e => {
  const code = bm.getAttribute('href');
  let ok = false;
  try { await navigator.clipboard.writeText(code); ok = true; } catch {
    const t = document.createElement('textarea');
    t.value = code; t.style.cssText = 'position:fixed;opacity:0'; document.body.append(t); t.select();
    try { ok = document.execCommand('copy'); } catch { /* nothing else to try */ }
    t.remove();
  }
  e.target.textContent = ok ? 'Copied' : 'Try copying again';
  hint.textContent = ok ? 'Copied! Now bookmark any page, edit that bookmark, and paste this in as its address.'
    : 'Couldn’t copy it here. ' + (touch ? 'Try another browser, or drag the button on a computer.' : 'Drag the button up to your bookmarks bar instead.');
  hint.classList.add('up');
});
})();
</script>
</body>
</html>
