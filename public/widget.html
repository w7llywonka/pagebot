<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>pagebot</title>
<script>
// paint the last-used theme on the first frame (the server's choice arrives a moment later)
(function () {
  var t = 'ember';
  try { t = localStorage.getItem('pb_theme') || t; } catch (e) {}
  if (t === 'auto') t = matchMedia('(prefers-color-scheme: light)').matches ? 'paper' : 'ember';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<style>
:root{--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--hd:46px;
  color-scheme:dark;--bg:#141414;--panel:#1d1d1d;--line:#2b2b2b;--text:#ebe8e1;--muted:#8e8a82;--accent:#d97757;--on-accent:#fff;--user:#2b2622;--err:#ff8a7a;--code:#0e0e0e;--chip-on:#2a201b;--focus:#4a4a4a;
  font:14px/1.45 var(--font)}
:root[data-theme=paper]{color-scheme:light;--bg:#faf9f5;--panel:#fff;--line:#e5e0d6;--text:#1f1e1b;--muted:#736e66;--accent:#c6613f;--on-accent:#fff;--user:#f1e7de;--err:#bf3b26;--code:#f2efe8;--chip-on:#f7e7de;--focus:#c9c1b4}
:root[data-theme=midnight]{color-scheme:dark;--bg:#0e1320;--panel:#151c2c;--line:#232d42;--text:#e2e8f5;--muted:#8590a8;--accent:#7c9cff;--on-accent:#0b1020;--user:#1c2847;--err:#ff8f8f;--code:#0a0f1a;--chip-on:#1a2547;--focus:#3a4766}
:root[data-theme=forest]{color-scheme:dark;--bg:#0f1511;--panel:#161e18;--line:#253128;--text:#e3ebe3;--muted:#859487;--accent:#5fc485;--on-accent:#08140c;--user:#1b2b20;--err:#ff8f80;--code:#0a0f0b;--chip-on:#163020;--focus:#35473a}
:root[data-theme=dusk]{color-scheme:dark;--bg:#14111c;--panel:#1c1826;--line:#2c2639;--text:#ebe6f5;--muted:#938aa6;--accent:#b48cff;--on-accent:#140d24;--user:#291f3d;--err:#ff8fa3;--code:#0f0c15;--chip-on:#2a1f45;--focus:#463d5a}
:root[data-theme=sakura]{color-scheme:light;--bg:#fff7f9;--panel:#fff;--line:#f0d8e0;--text:#2b2026;--muted:#7f6670;--accent:#d9467a;--on-accent:#fff;--user:#fde3ec;--err:#c0392b;--code:#fbeef3;--chip-on:#fde3ec;--focus:#e7bccb}
:root[data-theme=terminal]{color-scheme:dark;--bg:#050805;--panel:#0a110a;--line:#1a2b1a;--text:#a3f7a3;--muted:#5a9a5a;--accent:#39e75f;--on-accent:#031003;--user:#0e2111;--err:#ff6b6b;--code:#000;--chip-on:#0b2611;--focus:#2b4a2b;--font:var(--mono);font-size:13px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text)}
body{display:flex;flex-direction:column;overflow:hidden;position:relative}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
[hidden]{display:none!important}
body.tt,body.tt>:not(#boot),body.tt>:not(#boot) *{transition:background-color .35s ease,border-color .35s ease,color .35s ease!important}

/* header */
header{flex:none;display:flex;align-items:center;gap:2px;height:var(--hd);padding:0 6px 0 12px;border-bottom:1px solid var(--line);user-select:none;-webkit-user-select:none;position:relative;z-index:3;background:var(--bg)}
body.movable header{cursor:grab;touch-action:none}
body.dragging,body.dragging *{cursor:grabbing!important}
.title{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-weight:600;letter-spacing:.2px;white-space:nowrap}
.title a{color:inherit;text-decoration:none}
.dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.ib{flex:none;background:none;border:0;color:var(--muted);width:30px;height:30px;border-radius:8px;cursor:pointer;display:grid;place-items:center;padding:0}
.ib:hover,.ib.on{background:var(--line);color:var(--text)}
.ib svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib .ex,body.min .ib .mn{display:none}
body.min .ib .ex{display:block}
.mstat{display:none;align-items:center;margin-left:2px}
.mstat.new .typing{display:none}
.mstat.new::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}

/* minimized: the header becomes a pill */
body.min header{height:100%;border:0;padding:0 5px 0 15px;cursor:pointer}
body.min.movable header{cursor:grab}
body.min>:not(header){display:none!important}
body.min .hide-min{display:none!important}
body.min .mstat.busy,body.min .mstat.new{display:inline-flex}

/* chat */
#log{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin}
.empty{margin:auto;text-align:center;color:var(--muted);font-size:13px;max-width:272px}
.empty b{color:var(--text);font-weight:600;display:block;margin-bottom:4px;font-size:14px}
.empty .up{margin-top:12px;font-size:12px;border:1px dashed var(--line);border-radius:10px;padding:8px 10px}
.msg{max-width:92%;padding:8px 11px;border-radius:12px;overflow-wrap:anywhere;animation:msgIn .22s ease both}
@keyframes msgIn{from{opacity:0;transform:translateY(4px)}}
.msg.user{align-self:flex-end;background:var(--user)}
.msg.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
.msg.err .body{color:var(--err)}
.msg p{margin:0 0 7px}.msg p:last-child{margin:0}
.msg pre{background:var(--code);border:1px solid var(--line);padding:8px;border-radius:8px;overflow-x:auto;margin:6px 0;white-space:pre}
.msg code{font:12.5px/1.4 var(--mono)}
.msg :not(pre)>code{background:var(--code);padding:1px 4px;border-radius:4px}
.msg ul,.msg ol{margin:4px 0 7px;padding-left:20px}
.tags{font-size:11px;color:var(--muted);margin-bottom:3px}
.meta{font-size:11px;color:var(--muted);margin-top:5px}
.mini{background:none;border:0;padding:0;color:var(--accent);font-size:11px;cursor:pointer;text-decoration:underline}
.steps{display:flex;flex-direction:column;gap:2px;margin-bottom:6px;font-size:12px;color:var(--muted)}
.step::before{content:"🌐 "}
.step.live{animation:breathe 1.2s ease-in-out infinite}
@keyframes breathe{50%{opacity:.4}}
.src{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;font-size:11.5px}
.src span{color:var(--muted);width:100%}
.src a{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none;color:var(--text);background:var(--code);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.src a:hover{border-color:var(--accent)}
.thumb{display:block;max-width:100%;max-height:120px;border-radius:6px;margin-top:6px;border:1px solid var(--line)}
.note{align-self:center;font-size:12px;color:var(--muted);text-align:center;max-width:90%}
.typing{display:inline-flex;gap:3px}.typing i{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* composer */
#composer{flex:none;border-top:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:6px}
#att{display:none;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
#att img{height:44px;max-width:120px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.tools{display:flex;gap:5px;align-items:center}
.chip{flex:none;background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:4px 8px;font-size:12px;line-height:1.35;cursor:pointer;display:inline-flex;gap:4px;align-items:center;white-space:nowrap}
.chip:hover{color:var(--text)}
.chip.on{color:var(--text);border-color:var(--accent);background:var(--chip-on)}
.chip svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.chip.model{margin-left:auto;color:var(--text)}
.chip.model .mi{color:var(--accent)}
.chip.flip{animation:flip .3s ease}
@keyframes flip{40%{transform:scale(.9)}}
.row{display:flex;gap:6px;align-items:flex-end}
textarea{flex:1;resize:none;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 10px;max-height:140px;min-height:40px;outline:none}
textarea:focus,input:focus{border-color:var(--focus)}
.send{background:var(--accent);color:var(--on-accent);border:0;border-radius:10px;height:40px;padding:0 14px;font-weight:600;cursor:pointer}
.send:disabled{opacity:.45;cursor:default}
@media (max-width:350px){.chip .lb{display:none}}

/* settings sheet */
#sheet{position:absolute;left:0;right:0;top:var(--hd);bottom:0;z-index:2;background:var(--bg);overflow-y:auto;padding:14px 14px 20px;display:flex;flex-direction:column;gap:20px;animation:sheetIn .2s cubic-bezier(.2,.8,.2,1)}
@keyframes sheetIn{from{opacity:0;transform:translateY(-8px)}}
#sheet h3{margin:0 0 9px;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:650}
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sw{background:none;border:1px solid var(--line);border-radius:10px;padding:5px 5px 4px;cursor:pointer;color:var(--muted);display:flex;flex-direction:column;gap:4px;font-size:11.5px;min-width:0}
.sw:hover{color:var(--text)}
.sw.on{border-color:var(--accent);color:var(--text);box-shadow:0 0 0 1px var(--accent)}
.pv{position:relative;height:34px;border-radius:6px;background:var(--sw-bg);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(128,128,128,.22)}
.pv i{position:absolute;left:6px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--sw-acc)}
.pv u{position:absolute;left:6px;bottom:7px;width:22px;height:4px;border-radius:2px;background:var(--sw-text);opacity:.45}
.pv b{position:absolute;right:6px;top:13px;width:20px;height:9px;border-radius:5px;background:var(--sw-user)}
.sw[data-t=auto] .pv{background:linear-gradient(135deg,#141414 50%,#faf9f5 50%)}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{flex:1;background:none;border:0;border-left:1px solid var(--line);color:var(--muted);padding:6px 0;cursor:pointer;font-size:12.5px}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--chip-on);color:var(--text);font-weight:600}
.tokrow{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12.5px;color:var(--muted)}
.tokrow input{width:92px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;outline:none}
.fine{font-size:11.5px;color:var(--muted);margin:7px 0 0}
.acct{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ghost{background:none;border:1px solid var(--line);border-radius:9px;padding:6px 11px;cursor:pointer;font-size:13px}
.ghost:hover{border-color:var(--focus)}
.acct a{margin-left:auto;font-size:12.5px;color:var(--muted)}

/* lock screen */
#login{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px 24px;text-align:center;overflow-y:auto;outline:none}
#login.leave{animation:fadeOut .2s ease forwards}
.lk{width:44px;height:44px;border-radius:14px;background:var(--chip-on);color:var(--accent);display:grid;place-items:center;margin-bottom:2px;flex:none}
.lk svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#login h2{margin:0;font-size:16px}
#login p{margin:0;color:var(--muted);font-size:13px}
.dots{display:flex;gap:14px;height:14px;margin:12px 0 8px;flex:none}
.dots i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--muted);transition:background-color .12s,border-color .12s,transform .15s}
.dots i.f{background:var(--text);border-color:var(--text);transform:scale(1.1)}
.dots.busy i{animation:pin .55s ease-in-out infinite alternate}
.dots.busy i:nth-child(2){animation-delay:.07s}.dots.busy i:nth-child(3){animation-delay:.14s}.dots.busy i:nth-child(4){animation-delay:.21s}.dots.busy i:nth-child(5){animation-delay:.28s}
@keyframes pin{to{opacity:.3}}
.dots.ok i{background:var(--accent);border-color:var(--accent);transform:scale(1.25)}
.dots.bad{animation:shake .42s}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.pad{display:grid;grid-template-columns:repeat(3,56px);gap:10px 18px;flex:none}
.pad button{width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:20px;cursor:pointer;padding:0;transition:background-color .12s,transform .08s,border-color .12s}
.pad button:hover{border-color:var(--focus)}
.pad button:active,.pad button.hit{transform:scale(.92);background:var(--chip-on)}
.pad .del{border:0;background:none;color:var(--muted);display:grid;place-items:center}
.pad .del svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pwrow{display:flex;gap:8px;width:100%;max-width:290px;margin-top:6px}
.pwrow input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;outline:none}
#loginErr{color:var(--err);font-size:13px;min-height:18px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:12.5px;padding:2px}

/* region picker: the frozen screenshot fills the window and you drag a box on it */
.region{position:fixed;inset:0;z-index:60;background:#000;cursor:crosshair;touch-action:none;user-select:none;-webkit-user-select:none}
.region canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.region .shade{position:absolute;inset:0;background:rgba(0,0,0,.35)}
.region .sel{position:absolute;display:none;border-radius:2px;outline:2px solid var(--accent);box-shadow:0 0 0 200vmax rgba(0,0,0,.45)}
.region .size{position:absolute;display:none;padding:2px 6px;border-radius:5px;background:var(--accent);color:var(--on-accent);font:600 11px/1.4 var(--mono);pointer-events:none;white-space:nowrap}
.region.dragging .shade{display:none}
.region.dragging .sel,.region.dragging .size{display:block}
.rbar{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;max-width:calc(100% - 20px);padding:6px 6px 6px 12px;border-radius:12px;background:var(--panel);color:var(--text);border:1px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.4);font:13px/1.3 var(--font);cursor:default;animation:rbarIn .25s ease both}
.rbar button{background:var(--chip-on);border:1px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:12.5px}
.region.dragging .rbar{opacity:0;pointer-events:none}
@keyframes rbarIn{from{opacity:0;transform:translate(-50%,-6px)}}

/* loadup animation */
#boot{position:fixed;inset:0;z-index:100;display:grid;place-items:center;animation:failsafe 0s 10s forwards}
@keyframes failsafe{to{visibility:hidden}}
#boot .bg{position:absolute;inset:0;background:var(--bg);transition:opacity .42s ease .16s,background-color .35s ease}
#boot .c{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:-6px}
.orb{position:relative;width:96px;height:96px;display:grid;place-items:center}
.rings,.sats{position:absolute;inset:0}
.rings{transition:opacity .2s}
.rings i{position:absolute;inset:30px;border-radius:50%;border:1.5px solid var(--accent);opacity:0;animation:ripple 1.8s cubic-bezier(.2,.6,.3,1) .3s infinite}
.rings i+i{animation-delay:1.2s}
@keyframes ripple{0%{transform:scale(.6);opacity:.7}100%{transform:scale(2.3);opacity:0}}
.sats{transition:transform .34s cubic-bezier(.55,0,.75,.1),opacity .34s ease}
.spin{position:absolute;inset:0;animation:spin 2.4s linear infinite}
.spin i{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--accent);animation:satIn .55s cubic-bezier(.2,.8,.2,1) .22s both}
@keyframes satIn{from{opacity:0;transform:rotate(var(--a)) translateX(12px)}to{opacity:.8;transform:rotate(var(--a)) translateX(30px)}}
@keyframes spin{to{transform:rotate(360deg)}}
.fly{position:relative;width:20px;height:20px}
.core{display:block;width:20px;height:20px;border-radius:50%;background:var(--accent);animation:pop .55s cubic-bezier(.3,1.6,.5,1) both,glow 1.6s ease-in-out .55s infinite}
@keyframes pop{from{transform:scale(0)}}
@keyframes glow{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--accent) 16%,transparent),0 0 22px color-mix(in srgb,var(--accent) 45%,transparent)}}
.word{display:flex;font-weight:700;font-size:21px;letter-spacing:.4px;transition:opacity .25s,transform .25s}
.word span{display:inline-block;animation:letter .5s cubic-bezier(.2,.8,.2,1) calc(.2s + var(--i) * 45ms) both}
@keyframes letter{from{opacity:0;transform:translateY(9px);filter:blur(3px)}}
.bar{width:72px;height:2px;border-radius:2px;overflow:hidden;background:color-mix(in srgb,var(--muted) 22%,transparent);animation:fadeIn .3s ease .55s both;transition:opacity .2s}
.bar i{display:block;width:40%;height:100%;border-radius:2px;background:var(--accent);animation:sweep 1.1s ease-in-out infinite}
@keyframes sweep{from{transform:translateX(-110%)}to{transform:translateX(260%)}}
#boot.out{pointer-events:none}
#boot.out .bg,#boot.out .rings,#boot.out .bar{opacity:0}
#boot.out .sats{transform:scale(.1);opacity:0}
#boot.out .word{opacity:0;transform:translateY(-6px)}
body.booting header .dot{opacity:0}
body.reveal header{animation:fadeIn .45s ease .2s both}
body.reveal #log,body.reveal #login{animation:rise .55s cubic-bezier(.2,.8,.2,1) .28s both}
body.reveal #composer{animation:rise .55s cubic-bezier(.2,.8,.2,1) .36s both}
body.enter #log{animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
body.enter #composer{animation:rise .4s cubic-bezier(.2,.8,.2,1) .06s both}
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* full-page chat at /chat */
body.standalone{--hd:54px;max-width:780px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}
body.standalone header{padding:0 12px 0 18px}
body.standalone #log{padding:20px 18px}
body.standalone #composer{padding:12px 14px 16px}
body.standalone #pageBtn{display:none}
@media (max-width:780px){body.standalone{border:0}}
</style>
</head>
<body class="booting">
<div id="boot" aria-hidden="true">
  <div class="bg"></div>
  <div class="c">
    <div class="orb">
      <div class="rings"><i></i><i></i></div>
      <div class="sats"><div class="spin"><i style="--a:0deg"></i><i style="--a:120deg"></i><i style="--a:240deg"></i></div></div>
      <div class="fly"><b class="core"></b></div>
    </div>
    <div class="word"><span style="--i:0">p</span><span style="--i:1">a</span><span style="--i:2">g</span><span style="--i:3">e</span><span style="--i:4">b</span><span style="--i:5">o</span><span style="--i:6">t</span></div>
    <div class="bar"><i></i></div>
  </div>
</div>

<header>
  <div class="title"><span class="dot"></span><span class="name">pagebot</span><span class="mstat" id="mstat"><span class="typing"><i></i><i></i><i></i></span></span></div>
  <button class="ib hide-min" id="newBtn" title="New chat" hidden><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="ib hide-min" id="setBtn" title="Settings" hidden><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  <button class="ib hide-min" id="lockBtn" title="Lock" hidden><svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>
  <button class="ib" id="minBtn" title="Minimize" hidden><svg class="mn" viewBox="0 0 24 24"><path d="M6 12h12"/></svg><svg class="ex" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg></button>

</header>

<form id="login" autocomplete="off" tabindex="-1">
  <div class="lk"><svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>

<div id="sheet" hidden>

    <h3>Max tokens per answer</h3>

    <p class="fine">Counts the model's thinking too. Answers that hit it are marked “cut off”. Same setting as in /admin.</p>
  </section>
  <section class="acct"><button class="ghost" id="lockNow" type="button" hidden>Lock now</button><button class="ghost" id="outBtn" type="button">Log out</button><a href="/admin" target="_blank" rel="noopener">Usage &amp; admin ↗</a></section>
</div>

<div id="composer" hidden>
  <div id="att"><img alt=""><span id="attLabel">Screenshot attached</span><button class="ib" id="rmAtt" type="button" title="Remove"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
  <div class="tools">
    <button class="chip" id="pageBtn" type="button" title="Attach this page's text to the next message">📄<span class="lb">Page</span></button>
    <button class="chip" id="shotBtn" type="button" title="Screenshot the page">📷<span class="lb">Shot</span></button>
    <button class="chip" id="areaBtn" type="button" title="Screenshot just a region — drag a box over the page"><svg viewBox="0 0 24 24"><path d="M4 9V5h4M16 5h4v4M20 15v4h-4M8 19H4v-4"/></svg><span class="lb">Region</span></button>
    <button class="chip" id="webBtn" type="button" title="Let the model search the web">🌐<span class="lb">Web</span></button>

  </div>
</div>

<script>
(() => {
const $ = s => document.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const qs = new URLSearchParams(location.search);
const embedded = window.parent !== window;
const popup = !embedded && !!window.opener;
const target = embedded ? window.parent : (popup ? window.opener : null);
const hostV2 = embedded && qs.get('v') === '2'; // bookmarklet that can move, minimize and go full screen
const standalone = !embedded && !popup;
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
const body = document.body;
const wait = ms => new Promise(r => setTimeout(r, ms));

const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};

let token = store.get('pb_token');
let cfg = null; // /api/boot
let prefs = { theme: store.get('pb_theme') || 'ember', model: 'haiku', web: false };
let limits = { maxTokens: 2048, pageTokens: 5000, maxSearches: 3 };
let models = [{ key: 'haiku', label: 'Haiku 5.5' }, { key: 'sonnet', label: 'Sonnet 5.5' }];
let view = 'boot', convId = null, pageOn = true, img = null, imgKind = 'shot', busy = false, stream = null, video = null;
let minimized = false, unseen = false;

// ---- talk to the host page (bookmarklet) ----
const pending = new Map(); let seq = 0;
function ask(type, extra = {}, ms = 2500) {
  if (!target) return Promise.resolve(null);
  return new Promise(res => {
    const id = ++seq; pending.set(id, res);
    try { target.postMessage({ ...extra, type, id }, '*'); } catch { pending.delete(id); return res(null); }
    setTimeout(() => { if (pending.has(id)) { pending.delete(id); res(null); } }, ms);
  });
}
function tell(type, extra = {}) { if (target) try { target.postMessage({ ...extra, type }, '*'); } catch {} }
addEventListener('message', e => {
  if (!target || e.source !== target) return;
  const d = e.data || {};
  if (d.id && pending.has(d.id)) { pending.get(d.id)(d); pending.delete(d.id); }
  else if (d.type === 'restore') setMin(false);
});
let savedPos = null;
try { savedPos = JSON.parse(store.get('pb_pos')); } catch {}
tell('ready', hostV2 && savedPos ? { pos: savedPos } : {});

// ---- themes ----
const THEMES = [
  ['auto', 'Auto'],
  ['ember', 'Ember', '#141414', '#d97757', '#2b2622', '#ebe8e1'],
  ['paper', 'Paper', '#faf9f5', '#c6613f', '#f1e7de', '#1f1e1b'],
  ['midnight', 'Midnight', '#0e1320', '#7c9cff', '#1c2847', '#e2e8f5'],
  ['forest', 'Forest', '#0f1511', '#5fc485', '#1b2b20', '#e3ebe3'],
  ['dusk', 'Dusk', '#14111c', '#b48cff', '#291f3d', '#ebe6f5'],
  ['sakura', 'Sakura', '#fff7f9', '#d9467a', '#fde3ec', '#2b2026'],
  ['terminal', 'Terminal', '#050805', '#39e75f', '#0e2111', '#a3f7a3'],
];
const light = matchMedia('(prefers-color-scheme: light)');
const resolveTheme = t => t === 'auto' ? (light.matches ? 'paper' : 'ember') : t;
function applyTheme(t, fade) {
  const r = resolveTheme(t);
  store.set('pb_theme', t);
  document.querySelectorAll('.sw').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  if (document.documentElement.dataset.theme === r) return;
  if (fade) { body.classList.add('tt'); clearTimeout(applyTheme.t); applyTheme.t = setTimeout(() => body.classList.remove('tt'), 400); }
  document.documentElement.dataset.theme = r;
}
light.addEventListener('change', () => { if (prefs.theme === 'auto') applyTheme('auto', true); });
for (const [key, name, bg, acc, user, text] of THEMES) {
  const b = el('button', 'sw', '<span class="pv"><i></i><u></u><b></b></span><span class="nm"></span>');
  b.type = 'button'; b.dataset.t = key; b.title = key === 'auto' ? 'Follows your system light/dark setting' : name;
  b.querySelector('.nm').textContent = name;
  if (bg) b.style.cssText = `--sw-bg:${bg};--sw-acc:${acc};--sw-user:${user};--sw-text:${text}`;
  else b.style.cssText = '--sw-acc:#d97757;--sw-user:#2b2622;--sw-text:#8e8a82';
  b.onclick = () => { applyTheme(key, true); savePrefs({ theme: key }); };
  $('#themes').appendChild(b);
}

// ---- rendering ----
const log = $('#log');
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function inline(s) {
  return s.replace(/`([^`\n]+)`/g, '<code>$1</code>')
          .replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>')
          .replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
}
function block(txt) {
  const lines = txt.split('\n'); let html = '', list = null, para = [];
  const flushP = () => { if (para.length) { html += '<p>' + para.map(inline).join('<br>') + '</p>'; para = []; } };
  const flushL = () => { if (list) { html += `<${list.t}>` + list.items.map(i => '<li>' + inline(i) + '</li>').join('') + `</${list.t}>`; list = null; } };
  for (const raw of lines) {
    const ul = /^\s*[-*•]\s+(.*)$/.exec(raw), ol = /^\s*\d+[.)]\s+(.*)$/.exec(raw);
    if (ul || ol) {
      flushP(); const t = ul ? 'ul' : 'ol';
      if (!list || list.t !== t) { flushL(); list = { t, items: [] }; }
      list.items.push((ul || ol)[1]);
    } else if (!raw.trim()) { flushP(); flushL(); }
    else {
      flushL();
      const h = /^#{1,6}\s+(.*)$/.exec(raw);
      para.push(h ? `**${h[1]}**` : raw);
    }
  }
  flushP(); flushL(); return html;
}
function md(src) {
  return src.split('```').map((p, i) => {
    if (i % 2) { const nl = p.indexOf('\n'); const code = nl >= 0 && /^[\w+#.-]*$/.test(p.slice(0, nl).trim()) ? p.slice(nl + 1) : p;
      return '<pre><code>' + esc(code.replace(/\n$/, '')) + '</code></pre>'; }
    return block(esc(p));
  }).join('');
}
function clearEmpty() { const e = log.querySelector('.empty'); if (e) e.remove(); }
function addMsg(role, html, tags) {
  clearEmpty();
  const m = el('div', 'msg ' + role);
  if (tags) { const t = el('div', 'tags'); t.textContent = tags; m.appendChild(t); }
  const b = el('div', 'body', html); m.appendChild(b);
  log.appendChild(m); scroll(); return m;
}
function note(text) { clearEmpty(); const n = el('div', 'note'); n.textContent = text; log.appendChild(n); scroll(); }
function scroll() { log.scrollTop = log.scrollHeight; }
const fmt = n => n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + 'k' : String(n);
const host = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return u; } };
function empty() {
  if (standalone)
    return void (log.innerHTML = '<div class="empty"><b>Ask anything.</b>📷 shares a tab or window to screenshot (or just a region), 🌐 lets it search the web, or paste an image.</div>');
  log.innerHTML = '<div class="empty"><b>Ask about this page.</b>📄 attaches the page text (on for the first message), 📷 grabs a screenshot or just a region, 🌐 lets it search the web. Highlighted text is included automatically.' +
    (hostV2 ? '<br><br>Drag the top bar to move me.' : embedded ? '<div class="up">Re-drag the button from the pagebot homepage to update your bookmark — the new one lets you move and minimize this panel.</div>' : '') + '</div>';
}

// ---- views ----
function setHeader(chat) {
  $('#newBtn').hidden = $('#setBtn').hidden = !chat;
  $('#lockBtn').hidden = $('#lockNow').hidden = !(chat && cfg?.lock === 'passcode');
}
function showChat(enter) {
  view = 'chat';
  $('#login').style.display = 'none'; $('#login').classList.remove('leave');
  log.hidden = false; $('#composer').hidden = false;
  setHeader(true);
  if (!log.children.length) empty();
  if (enter) { body.classList.add('enter'); setTimeout(() => body.classList.remove('enter'), 600); }
  lastActive = Date.now();
  if (!minimized) setTimeout(() => $('#q').focus(), 50);
}
let pwMode = false, pin = '', pinBusy = false;
const pinMode = () => view === 'lock' && cfg?.lock === 'passcode' && !pwMode;
function showLogin(msg) {
  view = 'lock'; closeSheet();
  $('#login').style.display = 'flex'; $('#login').classList.remove('leave');
  log.hidden = true; $('#composer').hidden = true;
  setHeader(false);
  renderLock(msg);
}
function renderLock(msg) {
  const lock = cfg?.lock || 'password', usePin = pinMode();
  $('#pin').hidden = $('#pad').hidden = !usePin;
  $('#pwRow').hidden = usePin || lock === 'none';
  $('#lockSub').textContent = lock === 'none' ? 'No password is set yet — set one in /admin.'
    : usePin ? 'Enter your 5-digit passcode.' : 'Enter your pagebot password.';
  $('#switchLock').hidden = !(lock === 'passcode' && cfg?.passwordSet);
  $('#switchLock').textContent = pwMode ? 'Use passcode' : 'Use password instead';
  $('#loginErr').textContent = msg || '';
  pin = ''; pinBusy = false; renderDots();
  if (!minimized) setTimeout(() => usePin ? $('#login').focus() : $('#pw').focus(), 60);
}
$('#switchLock').onclick = () => { pwMode = !pwMode; renderLock(); };

// PIN pad
for (const k of ['1','2','3','4','5','6','7','8','9','','0','del']) {
  const b = el('button', k === 'del' ? 'del' : '', k === 'del' ? '<svg viewBox="0 0 24 24"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="m17 9-5 6M12 9l5 6"/></svg>' : k);
  b.type = 'button';
  if (!k) { b.style.visibility = 'hidden'; b.tabIndex = -1; }
  else { b.dataset.k = k; b.setAttribute('aria-label', k === 'del' ? 'Delete' : k); b.onclick = () => pinKey(k); }
  $('#pad').appendChild(b);
}
function renderDots() { $('#dots').querySelectorAll('i').forEach((d, i) => d.classList.toggle('f', i < pin.length)); }
function pinKey(k) {
  if (pinBusy) return;
  const b = $(`#pad [data-k="${k}"]`);
  if (b) { b.classList.add('hit'); setTimeout(() => b.classList.remove('hit'), 110); }
  $('#loginErr').textContent = '';
  if (k === 'del') pin = pin.slice(0, -1); else if (pin.length < 5) pin += k;
  renderDots();
  if (pin.length === 5) submitPin();
}
async function submitPin() {
  pinBusy = true;
  const dots = $('#dots'); dots.className = 'dots busy';
  const r = await login({ passcode: pin });
  if (r.ok) {
    dots.className = 'dots ok';
    await wait(calm ? 0 : 260);
    return unlocked();
  }
  dots.className = 'dots bad';
  await wait(420);
  dots.className = 'dots';
  if (!pinMode()) return renderLock(r.error);
  pin = ''; renderDots(); pinBusy = false;
  $('#loginErr').textContent = r.error;
}
$('#login').addEventListener('submit', async e => {
  e.preventDefault();
  if (pinMode()) return;
  const pw = $('#pw').value; if (!pw) return;
  $('#loginErr').textContent = '';
  const r = await login({ password: pw });
  if (r.ok) { $('#pw').value = ''; unlocked(); } else $('#loginErr').textContent = r.error;
});
async function login(data) {
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) }, body: JSON.stringify(data) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { if (j.usePassword) pwMode = true; return { error: j.error || 'Login failed' }; }
    token = j.token; store.set('pb_token', token); pwMode = false;
    await loadBoot().catch(() => {});
    return { ok: true };
  } catch { return { error: 'Network error' }; }
}
async function unlocked() {
  if (!calm) { $('#login').classList.add('leave'); await wait(180); }
  showChat(true);
}

function lock(msg) {
  if (token) fetch('/api/logout', { method: 'POST', headers: { Authorization: 'Bearer ' + token } }).catch(() => {});
  token = null; store.set('pb_token', null);
  showLogin(msg);
}
function logout(msg) { convId = null; log.innerHTML = ''; clearImg(); lock(msg); }
$('#outBtn').onclick = () => logout();
$('#lockBtn').onclick = $('#lockNow').onclick = () => lock();
$('#newBtn').onclick = () => { convId = null; setPage(true); clearImg(); closeSheet(); empty(); $('#q').focus(); };
function closePanel() {
  stopStream();
  if (embedded) tell('close'); else if (popup) window.close();
}
$('#closeBtn').onclick = closePanel;
if (standalone) {
  $('#closeBtn').hidden = true;
  body.classList.add('standalone');
  $('.name').innerHTML = '<a href="/">pagebot</a>';
  $('#q').placeholder = 'Ask anything, or paste a screenshot…';
  $('#shotBtn').title = 'Share a tab or window and screenshot it';
}

// ---- server ----
async function api(path, data) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }, body: JSON.stringify(data || {}) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || 'HTTP ' + r.status), { status: r.status });
  return j;
}
async function loadBoot() {
  const r = await fetch('/api/boot', { headers: token ? { Authorization: 'Bearer ' + token } : {} });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  cfg = await r.json();
  prefs.theme = cfg.theme;
  applyTheme(cfg.theme, true);
  if (cfg.authed) { Object.assign(prefs, cfg.prefs); limits = cfg.limits; models = cfg.models || models; }
  else if (token) { token = null; store.set('pb_token', null); }
  renderPrefs();
  return cfg;
}
const lockedMsg = () => cfg?.lock === 'passcode' ? 'Locked — enter your passcode to pick up where you left off.' : 'Session expired — log in again.';

// ---- settings: theme, model, web search, answer limit ----
const TOK = [[512, '512'], [1024, '1k'], [2048, '2k'], [4096, '4k'], [8192, '8k']];
for (const [n, label] of TOK) {
  const b = el('button', '', label); b.type = 'button'; b.dataset.n = n;
  b.onclick = () => savePrefs({ maxTokens: n });
  $('#tokSeg').appendChild(b);
}
let tokTimer = 0;
$('#tokIn').addEventListener('input', () => {
  clearTimeout(tokTimer);
  tokTimer = setTimeout(() => { const n = Math.round(+$('#tokIn').value); if (n >= 256 && n <= 64000) savePrefs({ maxTokens: n }); }, 500);
});
$('#tokIn').addEventListener('change', () => { clearTimeout(tokTimer); const n = Math.round(+$('#tokIn').value); if (n) savePrefs({ maxTokens: Math.min(64000, Math.max(256, n)) }); });
function renderPrefs() {
  $('#webBtn').classList.toggle('on', !!prefs.web);
  const m = models.find(x => x.key === prefs.model) || models[0];
  $('#modelName').textContent = m.label;
  $('#modelIcon').textContent = prefs.model === 'sonnet' ? '✦' : '⚡';
  const other = models.find(x => x.key !== m.key);
  $('#modelBtn').title = `Model: ${m.label}` + (other ? ` — click to switch to ${other.label}` : '');
  $('#tokSeg').querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.n === limits.maxTokens));
  if (document.activeElement !== $('#tokIn')) $('#tokIn').value = limits.maxTokens;
  document.querySelectorAll('.sw').forEach(b => b.classList.toggle('on', b.dataset.t === prefs.theme));
}
async function savePrefs(patch) {
  if ('maxTokens' in patch) limits.maxTokens = patch.maxTokens; else Object.assign(prefs, patch);
  renderPrefs();
  if (!token) return;
  try {
    const r = await api('/api/prefs', patch);
    Object.assign(prefs, r.prefs); limits = r.limits; renderPrefs();
  } catch (e) {
    if (e.status === 401) lock(lockedMsg()); else note('Couldn’t save that setting: ' + e.message);
  }
}
$('#webBtn').onclick = () => savePrefs({ web: !prefs.web });
$('#modelBtn').onclick = () => {
  const i = models.findIndex(x => x.key === prefs.model);
  const b = $('#modelBtn'); b.classList.remove('flip'); void b.offsetWidth; b.classList.add('flip');
  savePrefs({ model: models[(i + 1) % models.length].key });
};
let sheetOpen = false;
function openSheet(focusTokens) {
  if (view !== 'chat') return;
  sheetOpen = true; $('#sheet').hidden = false; $('#setBtn').classList.add('on');
  if (focusTokens) { $('#tokSec').scrollIntoView({ block: 'center' }); $('#tokIn').focus(); $('#tokIn').select(); }
}
function closeSheet() { sheetOpen = false; $('#sheet').hidden = true; $('#setBtn').classList.remove('on'); }
$('#setBtn').onclick = () => sheetOpen ? closeSheet() : openSheet();

// ---- move & minimize (needs the new bookmarklet) ----
const hd = $('header');
if (hostV2) { $('#minBtn').hidden = false; body.classList.add('movable'); }
function setStatus() {
  $('#mstat').className = 'mstat' + (minimized && busy ? ' busy' : minimized && unseen ? ' new' : '');
}
function setMin(on) {
  if (!hostV2 || minimized === on) return;
  minimized = on; body.classList.toggle('min', on);
  $('#minBtn').title = on ? 'Expand' : 'Minimize';
  if (on) closeSheet(); else unseen = false;
  tell('min', { on, w: 200, h: 46 });
  setStatus();
  if (!on && view === 'chat') setTimeout(() => $('#q').focus(), 220);
}
$('#minBtn').onclick = () => setMin(!minimized);
let drag = null;
hd.addEventListener('pointerdown', e => {
  if (!hostV2 || e.button !== 0 || e.target.closest('button,a')) return;
  drag = { x: e.screenX, y: e.screenY, moved: false };
  hd.setPointerCapture(e.pointerId);
});
hd.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.screenX - drag.x, dy = e.screenY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) < 4) return;
  drag.moved = true; body.classList.add('dragging');
  drag.x = e.screenX; drag.y = e.screenY;
  tell('drag', { dx, dy });
});
async function endDrag(e) {
  if (!drag) return;
  const moved = drag.moved; drag = null; body.classList.remove('dragging');
  if (moved) { const r = await ask('where'); if (r?.pos) store.set('pb_pos', JSON.stringify(r.pos)); }
  else if (minimized && e.type === 'pointerup') setMin(false);
}
hd.addEventListener('pointerup', endDrag);
hd.addEventListener('pointercancel', endDrag);

// ---- attachments ----
function setPage(v) { pageOn = v; $('#pageBtn').classList.toggle('on', v); }
$('#pageBtn').onclick = () => setPage(!pageOn);
function setImg(dataUrl, kind = 'shot') {
  img = dataUrl; imgKind = kind; $('#att img').src = dataUrl;
  $('#attLabel').textContent = kind === 'region' ? 'Region attached' : kind === 'paste' ? 'Image attached' : 'Screenshot attached';
  $('#att').style.display = 'flex';
}
function clearImg() { img = null; $('#att').style.display = 'none'; $('#att img').removeAttribute('src'); }
$('#rmAtt').onclick = clearImg;

function toJpeg(src, w, h) {
  const s = Math.min(1, 1568 / Math.max(w, h));
  const c = el('canvas'); c.width = Math.max(1, Math.round(w * s)); c.height = Math.max(1, Math.round(h * s));
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.82);
}
function stopStream() { if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; if (video) video.remove(); video = null; }

// one frame of the shared tab, with the panel hidden while it's taken
async function grab() {
  if (!navigator.mediaDevices?.getDisplayMedia) throw Object.assign(new Error('unsupported'), { code: 'unsupported' });
  if (!stream || !stream.active) {
    const opts = { video: { displaySurface: 'browser', frameRate: 5 }, audio: false, selfBrowserSurface: 'include', surfaceSwitching: 'exclude' };
    if (embedded) opts.preferCurrentTab = true;
    stream = await navigator.mediaDevices.getDisplayMedia(opts);
    stream.getVideoTracks()[0].addEventListener('ended', () => stopStream());
    video = el('video');
    video.muted = true; video.playsInline = true; video.srcObject = stream;
    video.style.cssText = 'position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none';
    body.appendChild(video);
    await video.play();
  }
  if (embedded) await ask('hide', {}, 1000); // so the panel isn't in the shot
  await wait(350);
  const w = video.videoWidth, h = video.videoHeight;
  if (!w) { if (embedded) tell('show'); throw new Error('no frame yet, try again'); }
  const c = el('canvas'); c.width = w; c.height = h;
  c.getContext('2d').drawImage(video, 0, 0, w, h);
  return c;
}
function shotFailed(e) {
  if (embedded) tell('show');
  note(e?.code === 'unsupported' ? 'Screenshots aren’t supported in this browser — paste one instead.'
    : e?.name === 'NotAllowedError' ? 'Screenshot cancelled or blocked on this site. You can paste one instead (Win+Shift+S / Cmd+Ctrl+Shift+4, then Ctrl/Cmd+V).'
    : 'Screenshot failed: ' + (e?.message || e));
}
$('#shotBtn').onclick = async () => {
  try {
    const c = await grab();
    if (embedded) tell('show');
    setImg(toJpeg(c, c.width, c.height)); $('#q').focus();
  } catch (e) { shotFailed(e); }
};
$('#areaBtn').onclick = async () => {
  let c;
  try { c = await grab(); } catch (e) { return shotFailed(e); }
  const r = await pickRegion(c);
  if (r) { setImg(r.url, r.kind); $('#q').focus(); }
};

// shows the frozen frame full screen and lets you drag a box on it
let region = null;
function pickRegion(canvas) {
  return new Promise(resolve => {
    const ov = el('div', 'region'), sel = el('div', 'sel'), size = el('div', 'size');
    const bar = el('div', 'rbar', '<span>Drag to select an area</span><button type="button" data-a="full">Whole screen</button><button type="button" data-a="x">Cancel</button>');
    ov.append(canvas, el('div', 'shade'), sel, size, bar);
    body.appendChild(ov);
    if (hostV2) tell('full', { on: true });
    if (embedded) tell('show');
    let start = null, g = null, finished = false;
    const geo = () => {
      const W = ov.clientWidth, H = ov.clientHeight, s = Math.min(W / canvas.width, H / canvas.height);
      return { s, w: canvas.width * s, h: canvas.height * s, ox: (W - canvas.width * s) / 2, oy: (H - canvas.height * s) / 2, W, H };
    };
    const pt = e => ({ x: Math.min(g.ox + g.w, Math.max(g.ox, e.clientX)), y: Math.min(g.oy + g.h, Math.max(g.oy, e.clientY)) });
    const box = (a, b) => ({ x: Math.min(a.x, b.x), y: Math.min(a.y, b.y), w: Math.abs(a.x - b.x), h: Math.abs(a.y - b.y) });
    const draw = r => {
      Object.assign(sel.style, { left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' });
      size.textContent = `${Math.round(r.w / g.s)} × ${Math.round(r.h / g.s)}`;
      size.style.left = Math.min(r.x + r.w + 6, g.W - size.offsetWidth - 4) + 'px';
      size.style.top = Math.min(r.y + r.h + 6, g.H - 24) + 'px';
    };
    ov.addEventListener('pointerdown', e => {
      if (e.button !== 0 || e.target.closest('.rbar')) return;
      g = geo(); start = pt(e);
      ov.setPointerCapture(e.pointerId); ov.classList.add('dragging'); draw(box(start, start));
    });
    ov.addEventListener('pointermove', e => { if (start) draw(box(start, pt(e))); });
    ov.addEventListener('pointerup', e => {
      if (!start) return;
      const r = box(start, pt(e)); start = null;
      if (r.w < 8 || r.h < 8) return void ov.classList.remove('dragging');
      const sx = (r.x - g.ox) / g.s, sy = (r.y - g.oy) / g.s, sw = r.w / g.s, sh = r.h / g.s;
      const c = el('canvas'); c.width = Math.max(1, Math.round(sw)); c.height = Math.max(1, Math.round(sh));
      c.getContext('2d').drawImage(canvas, sx, sy, sw, sh, 0, 0, c.width, c.height);
      done({ url: toJpeg(c, c.width, c.height), kind: 'region' });
    });
    const whole = () => done({ url: toJpeg(canvas, canvas.width, canvas.height), kind: 'shot' });
    bar.addEventListener('click', e => { const a = e.target.closest('button')?.dataset.a; if (a === 'full') whole(); else if (a === 'x') done(null); });
    region = { cancel: () => done(null), whole };
    async function done(result) {
      if (finished) return; finished = true; region = null;
      if (hostV2) await ask('full', { on: false }, 1000);
      ov.remove();
      if (embedded) requestAnimationFrame(() => tell('show'));
      resolve(result);
    }
  });
}

$('#q').addEventListener('paste', async e => {
  const it = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
  if (!it) return;
  e.preventDefault();
  try { const bmp = await createImageBitmap(it.getAsFile()); setImg(toJpeg(bmp, bmp.width, bmp.height), 'paste'); }
  catch { note('Couldn’t read that image.'); }
});

// ---- keyboard ----
addEventListener('keydown', e => {
  if (region) {
    if (e.key === 'Escape') { e.preventDefault(); region.cancel(); }
    else if (e.key === 'Enter') { e.preventDefault(); region.whole(); }
    return;
  }
  if (pinMode() && !e.metaKey && !e.ctrlKey && !e.altKey) {
    if (/^[0-9]$/.test(e.key)) { e.preventDefault(); return pinKey(e.key); }
    if (e.key === 'Backspace') { e.preventDefault(); return pinKey('del'); }
  }
  if (e.key === 'Escape') { if (sheetOpen) closeSheet(); else closePanel(); }
});

// ---- auto-lock after the passcode timeout, and keep the session alive while you're active ----
let lastActive = Date.now(), lastPing = Date.now();
function activity() {
  lastActive = Date.now();
  const mins = cfg?.lockMinutes || 0;
  if (mins && token && view === 'chat' && lastActive - lastPing > Math.min(60_000, mins * 20_000)) {
    lastPing = lastActive;
    api('/api/ping').catch(e => { if (e.status === 401) lock(lockedMsg()); });
  }
}
for (const ev of ['pointerdown', 'keydown', 'wheel', 'input']) addEventListener(ev, activity, { capture: true, passive: true });
setInterval(() => {
  const mins = cfg?.lockMinutes || 0;
  if (mins && token && view === 'chat' && !busy && Date.now() - lastActive >= mins * 60_000)
    lock(`Locked after ${mins >= 60 ? mins / 60 + ' hour' + (mins > 60 ? 's' : '') : mins + ' minute' + (mins > 1 ? 's' : '')} without activity.`);
}, 5000);

// ---- composer ----
const q = $('#q');
function autosize() { q.style.height = 'auto'; q.style.height = Math.min(q.scrollHeight, 140) + 'px'; }
q.addEventListener('input', autosize);
q.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
$('#sendBtn').onclick = send;

function searchStep(bot, query) {
  let steps = bot.querySelector('.steps');
  if (!steps) { steps = el('div', 'steps'); bot.prepend(steps); }
  let s = steps.querySelector('.live');
  if (!s) { s = el('div', 'step live'); steps.appendChild(s); }
  if (query) { s.classList.remove('live'); s.textContent = `Searched “${query}”`; }
  else s.textContent = 'Searching the web…';
  scroll();
}
function finish(bot, out, ev) {
  convId = ev.conversationId;
  bot.querySelectorAll('.step.live').forEach(s => s.remove());
  if ('refusal' in ev) {
    bot.classList.add('err');
    out.innerHTML = '<p>⚠ The model declined to answer this' + (ev.refusal ? ` (${esc(String(ev.refusal))})` : '') + '. Try rephrasing it.</p>';
  }
  const srcs = (ev.sources || []).filter(s => /^https?:\/\//.test(s.url));
  if (srcs.length) {
    const box = el('div', 'src'); box.appendChild(el('span', '', 'Sources'));
    for (const s of srcs) {
      const a = el('a'); a.href = s.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
      a.textContent = s.title || host(s.url); a.title = s.url; box.appendChild(a);
    }
    bot.appendChild(box);
  }
  const m = el('div', 'meta');
  m.textContent = [ev.model + (ev.fallback ? ' (fallback)' : ''), `${fmt(ev.usage.in)} in · ${fmt(ev.usage.out)} out`,
    ev.searches ? `${ev.searches} search${ev.searches === 1 ? '' : 'es'}` : ''].filter(Boolean).join(' · ');
  if (ev.stop === 'max_tokens') {
    m.append(' · cut off · ');
    const b = el('button', 'mini', 'raise limit'); b.type = 'button'; b.onclick = () => openSheet(true); m.appendChild(b);
  }
  bot.appendChild(m);
}

async function send() {
  if (busy || view !== 'chat') return;
  const text = q.value.trim();
  const info = await ask('page', { max: limits.pageTokens * 4 });
  const page = pageOn && info?.page ? info.page : null;
  const selection = info?.selection?.trim() || '';
  if (!text && !img && !page && !selection) return;

  busy = true; $('#sendBtn').disabled = true; setStatus();
  const tags = [page && '📄 page', selection && '✂️ highlighted', img && (imgKind === 'region' ? '📷 region' : imgKind === 'paste' ? '🖼 image' : '📷 screenshot'), prefs.web && '🌐 web'].filter(Boolean).join(' · ');
  const u = addMsg('user', text ? esc(text).replace(/\n/g, '<br>') : '<i>(no text)</i>', tags);
  if (img) { const im = el('img', 'thumb'); im.src = img; u.appendChild(im); }

  const sent = { text, img, imgKind, pageOn };
  const reqBody = { conversationId: convId, message: text, page, selection, image: img, model: prefs.model, web: !!prefs.web };
  q.value = ''; autosize(); clearImg(); setPage(false);

  const bot = addMsg('bot', '<span class="typing"><i></i><i></i><i></i></span>');
  const out = bot.querySelector('.body');
  let acc = '', refused = false;
  try {
    const r = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }, body: JSON.stringify(reqBody) });
    if (r.status === 401) {
      // put the message back so nothing typed is lost, then lock
      u.remove(); bot.remove(); if (!log.querySelector('.msg')) empty();
      q.value = sent.text; autosize(); if (sent.img) setImg(sent.img, sent.imgKind); setPage(sent.pageOn);
      lock(lockedMsg()); return;
    }
    if (!r.ok || !r.body) { const j = await r.json().catch(() => ({})); throw new Error(j.error || 'HTTP ' + r.status); }
    const rd = r.body.getReader(), dec = new TextDecoder(); let buf = '';
    for (;;) {
      const { done, value } = await rd.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, i); buf = buf.slice(i + 1);
        if (!line.trim()) continue;
        const ev = JSON.parse(line);
        if (ev.t === 'd') { acc += ev.v; out.innerHTML = md(acc); scroll(); }
        else if (ev.t === 's') searchStep(bot, ev.q);
        else if (ev.t === 'done') { refused = 'refusal' in ev; finish(bot, out, ev); }
        else if (ev.t === 'err') throw new Error(ev.v);
      }
    }
    if (!acc && !refused) out.innerHTML = '<i>(empty reply)</i>';
  } catch (e) {
    bot.classList.add('err');
    bot.querySelectorAll('.step.live').forEach(s => s.remove());
    out.innerHTML = (acc ? md(acc) : '') + '<p>⚠ ' + esc(e.message || String(e)) + '</p>';
  } finally {
    busy = false; $('#sendBtn').disabled = false;
    if (view === 'chat') { scroll(); if (minimized) unseen = true; else q.focus(); }
    setStatus();
  }
}

// ---- start: splash while we load, then fade into the chat ----
async function endSplash() {
  const boot = $('#boot');
  const left = (calm ? 150 : 850) - performance.now();
  if (left > 0) await wait(left);
  body.classList.add('reveal');
  boot.classList.add('out');
  const fly = boot.querySelector('.fly'), dot = $('header .dot');
  let landed = Promise.resolve();
  if (!calm && fly.animate) {
    const a = fly.getBoundingClientRect(), b = dot.getBoundingClientRect();
    if (b.width && a.width) {
      const dx = b.left + b.width / 2 - (a.left + a.width / 2), dy = b.top + b.height / 2 - (a.top + a.height / 2);
      landed = fly.animate([{ transform: 'none' }, { transform: `translate(${dx}px,${dy}px) scale(${b.width / a.width})` }],
        { duration: 520, delay: 70, easing: 'cubic-bezier(.6,0,.25,1)', fill: 'forwards' }).finished.catch(() => {});
    }
  }
  await Promise.race([landed, wait(1200)]);
  body.classList.remove('booting');
  if (!calm) dot.animate?.([{ transform: 'scale(2.1)' }, { transform: 'scale(1)' }], { duration: 420, easing: 'cubic-bezier(.3,1.7,.5,1)' });
  await wait(calm ? 0 : 120);
  boot.remove();
  setTimeout(() => body.classList.remove('reveal'), 900);
}

setPage(true);
renderPrefs();
(async () => {
  try { await loadBoot(); } catch {}
  if (token) showChat(); else showLogin(cfg ? '' : 'Can’t reach the pagebot server.');
  await endSplash();
})();
})();
</script>
</body>
